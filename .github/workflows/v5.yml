name: V5 repository verification

on:
  push:
  pull_request:

jobs:
  v5-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V5 Python dependencies
        run: python -m pip install -r requirements-v5.txt
      - name: Run V5 audits and regression checks
        run: python scripts/reproduce_v5.py
      - name: Check manuscript-number consistency
        run: python scripts/audit_v5_final_consistency.py
      - name: Check tracked paths and secrets explicitly
        run: python scripts/audit_repository_safety.py
      - name: Verify anonymous bundle manifest
        run: python scripts/verify_v5_bundle.py
